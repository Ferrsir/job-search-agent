name: Role Intelligence Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

jobs:
  weekly-job-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Run job agent
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_SEARCH_QUERY: ${{ vars.GMAIL_SEARCH_QUERY }}
          FEEDBACK_EXPORT_PATH: ${{ vars.FEEDBACK_EXPORT_PATH }}
          ENABLE_PUBLIC_SOURCE_SEARCH: ${{ vars.ENABLE_PUBLIC_SOURCE_SEARCH || 'false' }}
          PUBLIC_SOURCE_URLS: ${{ vars.PUBLIC_SOURCE_URLS }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          LINKEDIN_DATA_DIRS: ${{ vars.LINKEDIN_DATA_DIRS }}
          JOB_SEARCH_USER_FIRST_NAME: ${{ vars.JOB_SEARCH_USER_FIRST_NAME }}
          JOB_SEARCH_USER_FULL_NAME: ${{ vars.JOB_SEARCH_USER_FULL_NAME }}
          JOB_SEARCH_USER_INITIALS: ${{ vars.JOB_SEARCH_USER_INITIALS }}
          JOB_SEARCH_SITE_TITLE: ${{ vars.JOB_SEARCH_SITE_TITLE }}
          JOB_SEARCH_SITE_SUBTITLE: ${{ vars.JOB_SEARCH_SITE_SUBTITLE }}
          JOB_SEARCH_PROFILE_SUMMARY: ${{ vars.JOB_SEARCH_PROFILE_SUMMARY }}
          JOB_SEARCH_DASHBOARD_URL: ${{ vars.JOB_SEARCH_DASHBOARD_URL }}
          JOB_SEARCH_APPLICATION_CONTEXT: ${{ vars.JOB_SEARCH_APPLICATION_CONTEXT }}
        run: job-search-agent
      - name: Upload HTML rundown artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-search-html-rundown
          path: artifacts/*.html
      - name: Prepare Pages site
        run: |
          mkdir -p site
          latest_digest="$(ls -t artifacts/*.html | head -n 1)"
          cp "$latest_digest" site/index.html
          cp artifacts/preferences.html site/preferences.html
          cp -R assets site/assets
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

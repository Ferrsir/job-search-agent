name: Role Intelligence Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

jobs:
  weekly-job-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Run job agent
        env:
          DRY_RUN: "false"
          GOOGLE_SHEET_ID: "1gmg8EV3FUerg8oeQoAVq1LoATvg4ixgmeVtqWLp8FhI"
          GMAIL_TO: "ferrislavigne@gmail.com"
          GMAIL_SEARCH_QUERY: 'label:"Job Search Agent" newer_than:14d'
          FEEDBACK_EXPORT_PATH: ${{ vars.FEEDBACK_EXPORT_PATH }}
          ENABLE_PUBLIC_SOURCE_SEARCH: "true"
          PUBLIC_SOURCE_URLS: "https://www.deloitte.com/us/en/careers/internships.html,https://www.pwc.com/us/en/careers/entry-level/internships.html,https://www.ey.com/en_us/careers/student-entry-level-programs,https://www.kpmguscareers.com/early-career/program/,https://www.jpmorganchase.com/careers/explore-opportunities/students-and-graduates,https://www.goldmansachs.com/careers/students,https://www.morganstanley.com/campus,https://careers.bankofamerica.com/en-us/students/programs,https://www.wellsfargojobs.com/en/early-careers/,https://careers.td.com/student-new-grads/early-talent-programs/,https://hl.com/careers/early-careers/,https://www.raymondjames.com/careers/students-and-recent-grads/internships,https://www.stout.com/en/careers/students-early-career,https://www.cbiz.com/careers/students-recent-graduates,https://rsmus.com/careers/students/internships-at-rsm.html,https://www.texascapitalbank.com/who-we-are/careers/students-and-graduates,https://www.hilltop.com/careers/student-intern/,https://careers.comerica.com/us/en/university-recruiting-"
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          LINKEDIN_DATA_DIRS: ${{ vars.LINKEDIN_DATA_DIRS }}
          JOB_SEARCH_USER_FIRST_NAME: "Ferris"
          JOB_SEARCH_USER_FULL_NAME: "Ferris Jagger-James Childress LaVigne"
          JOB_SEARCH_USER_INITIALS: "FL"
          JOB_SEARCH_SITE_TITLE: "Ferris' Career Center"
          JOB_SEARCH_SITE_SUBTITLE: "Career Center"
          JOB_SEARCH_PROFILE_SUMMARY: "TAMS/SMU student interested in investment banking, private equity, financial analysis, and finance-focused internships involving company research, modeling, valuation, and due diligence."
          JOB_SEARCH_DASHBOARD_URL: "https://Ferrsir.github.io/job-search-agent/"
          JOB_SEARCH_APPLICATION_CONTEXT: "Use Ferris's uploaded resume, cover-letter examples, and style guide as the source of truth. Target finance internships and early analyst-style roles in DFW/Texas. Do not invent personal facts, credentials, GPA, deal experience, licenses, or university status beyond provided materials."
        run: job-search-agent
      - name: Upload HTML rundown artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-search-html-rundown
          path: artifacts/*.html
      - name: Prepare Pages site
        run: |
          mkdir -p site
          latest_digest="$(ls -t artifacts/*.html | head -n 1)"
          cp "$latest_digest" site/index.html
          cp artifacts/preferences.html site/preferences.html
          cp -R assets site/assets
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

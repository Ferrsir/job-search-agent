name: Email Weekly Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1"

jobs:
  email-weekly-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Send Sheet-backed weekly brief
        env:
          DRY_RUN: "false"
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          LINKEDIN_DATA_DIRS: ${{ vars.LINKEDIN_DATA_DIRS }}
          JOB_SEARCH_USER_FIRST_NAME: ${{ vars.JOB_SEARCH_USER_FIRST_NAME }}
          JOB_SEARCH_USER_FULL_NAME: ${{ vars.JOB_SEARCH_USER_FULL_NAME }}
          JOB_SEARCH_USER_INITIALS: ${{ vars.JOB_SEARCH_USER_INITIALS }}
          JOB_SEARCH_SITE_TITLE: ${{ vars.JOB_SEARCH_SITE_TITLE }}
          JOB_SEARCH_SITE_SUBTITLE: ${{ vars.JOB_SEARCH_SITE_SUBTITLE }}
          JOB_SEARCH_PROFILE_SUMMARY: ${{ vars.JOB_SEARCH_PROFILE_SUMMARY }}
          JOB_SEARCH_DASHBOARD_URL: ${{ vars.JOB_SEARCH_DASHBOARD_URL }}
          JOB_SEARCH_APPLICATION_CONTEXT: ${{ vars.JOB_SEARCH_APPLICATION_CONTEXT }}
        run: job-search-brief
      - name: Upload emailed brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: emailed-weekly-brief
          path: artifacts/*.html

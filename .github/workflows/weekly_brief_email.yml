name: Email Weekly Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1"

jobs:
  email-weekly-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Send Sheet-backed weekly brief
        env:
          DRY_RUN: "false"
          GOOGLE_SHEET_ID: "1gmg8EV3FUerg8oeQoAVq1LoATvg4ixgmeVtqWLp8FhI"
          GMAIL_TO: "ferrislavigne@gmail.com"
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          LINKEDIN_DATA_DIRS: ${{ vars.LINKEDIN_DATA_DIRS }}
          JOB_SEARCH_USER_FIRST_NAME: "Ferris"
          JOB_SEARCH_USER_FULL_NAME: "Ferris Jagger-James Childress LaVigne"
          JOB_SEARCH_USER_INITIALS: "FL"
          JOB_SEARCH_SITE_TITLE: "Ferris' Career Center"
          JOB_SEARCH_SITE_SUBTITLE: "Career Center"
          JOB_SEARCH_PROFILE_SUMMARY: "TAMS/SMU student interested in investment banking, private equity, financial analysis, and finance-focused internships involving company research, modeling, valuation, and due diligence."
          JOB_SEARCH_DASHBOARD_URL: "https://Ferrsir.github.io/job-search-agent/"
          JOB_SEARCH_APPLICATION_CONTEXT: "Use Ferris's uploaded resume, cover-letter examples, and style guide as the source of truth. Target finance internships and early analyst-style roles in DFW/Texas. Do not invent personal facts, credentials, GPA, deal experience, licenses, or university status beyond provided materials."
        run: job-search-brief
      - name: Upload emailed brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: emailed-weekly-brief
          path: artifacts/*.html

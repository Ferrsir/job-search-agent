name: Free Public Job Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "15 14 */2 * *"

jobs:
  free-public-job-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Pull free public jobs into tracker
        env:
          DRY_RUN: "false"
          GOOGLE_SHEET_ID: "1gmg8EV3FUerg8oeQoAVq1LoATvg4ixgmeVtqWLp8FhI"
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          PUBLIC_SOURCE_URLS: "https://www.deloitte.com/us/en/careers/internships.html,https://www.pwc.com/us/en/careers/entry-level/internships.html,https://www.ey.com/en_us/careers/student-entry-level-programs,https://www.kpmguscareers.com/early-career/program/,https://www.jpmorganchase.com/careers/explore-opportunities/students-and-graduates,https://www.goldmansachs.com/careers/students,https://www.morganstanley.com/campus,https://careers.bankofamerica.com/en-us/students/programs,https://www.wellsfargojobs.com/en/early-careers/,https://careers.td.com/student-new-grads/early-talent-programs/,https://hl.com/careers/early-careers/,https://www.raymondjames.com/careers/students-and-recent-grads/internships,https://www.stout.com/en/careers/students-early-career,https://www.cbiz.com/careers/students-recent-graduates,https://rsmus.com/careers/students/internships-at-rsm.html,https://www.texascapitalbank.com/who-we-are/careers/students-and-graduates,https://www.hilltop.com/careers/student-intern/,https://careers.comerica.com/us/en/university-recruiting-"
          FEEDBACK_EXPORT_PATH: ${{ vars.FEEDBACK_EXPORT_PATH }}
        run: job-search-public-sync

name: Free Public Job Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "15 14 */2 * *"

jobs:
  free-public-job-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Pull free public jobs into tracker
        env:
          DRY_RUN: ${{ vars.PUBLIC_SYNC_DRY_RUN || 'false' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          PUBLIC_SOURCE_URLS: ${{ vars.PUBLIC_SOURCE_URLS }}
          FEEDBACK_EXPORT_PATH: ${{ vars.FEEDBACK_EXPORT_PATH }}
        run: job-search-public-sync

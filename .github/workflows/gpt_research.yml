name: GPT Role Research

on:
  workflow_dispatch:

jobs:
  gpt-role-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Run GPT web research
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-5' }}
          RESEARCH_MIN_JOBS: ${{ vars.RESEARCH_MIN_JOBS || '5' }}
          RESEARCH_MIN_GREAT_FITS: ${{ vars.RESEARCH_MIN_GREAT_FITS || '1' }}
          RESEARCH_TIMEOUT_SECONDS: ${{ vars.RESEARCH_TIMEOUT_SECONDS || '900' }}
          FEEDBACK_EXPORT_PATH: ${{ vars.FEEDBACK_EXPORT_PATH }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          JOB_SEARCH_USER_FIRST_NAME: ${{ vars.JOB_SEARCH_USER_FIRST_NAME }}
          JOB_SEARCH_USER_FULL_NAME: ${{ vars.JOB_SEARCH_USER_FULL_NAME }}
          JOB_SEARCH_USER_INITIALS: ${{ vars.JOB_SEARCH_USER_INITIALS }}
          JOB_SEARCH_SITE_TITLE: ${{ vars.JOB_SEARCH_SITE_TITLE }}
          JOB_SEARCH_SITE_SUBTITLE: ${{ vars.JOB_SEARCH_SITE_SUBTITLE }}
          JOB_SEARCH_PROFILE_SUMMARY: ${{ vars.JOB_SEARCH_PROFILE_SUMMARY }}
          JOB_SEARCH_DASHBOARD_URL: ${{ vars.JOB_SEARCH_DASHBOARD_URL }}
          JOB_SEARCH_APPLICATION_CONTEXT: ${{ vars.JOB_SEARCH_APPLICATION_CONTEXT }}
        run: job-search-research
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpt-role-research
          path: artifacts/*
      - name: Prepare Pages site from research
        run: |
          mkdir -p site
          latest_dashboard="$(ls -t artifacts/*dashboard*.html artifacts/*.html 2>/dev/null | head -n 1)"
          if [ -n "$latest_dashboard" ]; then
            cp "$latest_dashboard" site/index.html
          else
            printf '<!doctype html><title>Research unavailable</title><p>No successful research dashboard was generated.</p>' > site/index.html
          fi
          if [ -f artifacts/preferences.html ]; then
            cp artifacts/preferences.html site/preferences.html
          fi
          cp -R assets site/assets
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
